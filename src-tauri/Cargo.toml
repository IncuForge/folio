[package]
name = "folio"
version = "0.1.0"
description = "Local-first catering operations for small teams"
authors = ["IncuForge"]
license = "MIT"
repository = "https://github.com/IncuForge/folio"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "folio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-barcode-scanner = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tiny_http = "0.12"
local-ip-address = "0.6"
rand = "0.8"
sha2 = "0.10"

# Keep installable CI debug APKs compact while retaining debug signing.
[profile.dev]
opt-level = "s"
debug = 0
strip = "debuginfo"
incremental = false
panic = "abort"

# Production Android/desktop packages favor download size.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"