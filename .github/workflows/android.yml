name: Folio Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  build-android:
    name: Android debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Install Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Initialize Android project
        run: npm run android:init -- --ci

      - name: Build Android debug APK
        run: npm run android:build -- --debug

      - name: Upload Android APK
        uses: actions/upload-artifact@v6
        with:
          name: folio-android-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error