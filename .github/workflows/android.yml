name: Folio Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "mobile/folio_mobile/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: folio-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Flutter Android release APKs
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    defaults:
      run:
        working-directory: mobile/folio_mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install locked Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze Flutter source
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build optimized APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload Android APKs
        uses: actions/upload-artifact@v6
        with:
          name: folio-android-release-apks
          path: mobile/folio_mobile/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 14
